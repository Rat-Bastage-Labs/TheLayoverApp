<!DOCTYPE html>
<html>
<head>
  <title>User Location</title>
  <style>
    body { 
      font-size: 15px;
      font-family: Arial; 
      text-align: center; 
      background: #eef; 
      color: black;
    }
    #output { 
      margin-top:20px; 
    }
  </style>
</head>
<body>
  <h4>User Location</h4>
  <div id="output">Getting location...</div>
  <script>
  function sendLocation() {
    const output = document.getElementById("output");

    if (!navigator.geolocation) {
      output.innerHTML = "Geolocation not supported.";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        output.innerHTML = `Your location: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>Sending to server...`;

        fetch("/location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ lat, lon })
        })
        .then(res => res.text())
        .then(responseText => {
          output.innerHTML += `<br>Server response: ${responseText}`;
        })
        .catch(err => {
          output.innerHTML += `<br>Error sending location: ${err}`;
          console.error(err);
        });
      },
      err => {
        output.innerHTML = `Error: ${err.message}`;
      }
    );
  }
  
  window.addEventListener("DOMContentLoaded", sendLocation);
  setInterval(() => {
    location.reload();
  }, 30000); 
  </script>
</body>
</html>
